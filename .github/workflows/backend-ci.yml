name: Backend CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plantogether_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test

      PORT: 3000
      JWT_SECRET: test_secret_key

      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres

      DB_NAME: plantogether_db
      DB_NAME_TEST: plantogether_test_db

      DB_SSL: false

      LOG_LEVEL: silent

      UPLOAD_DIR: uploads

      BCRYPT_SALT_ROUNDS: 4

      AUTH_RATE_LIMIT_WINDOW_MS: 900000
      AUTH_RATE_LIMIT_MAX: 1000

      GEOCODING_PROVIDER: nominatim
      GEOCODING_USER_AGENT: PlanTogetherTest/1.0
      NOMINATIM_SEARCH_URL: https://nominatim.openstreetmap.org/search
      GEOCODING_RESULT_LIMIT: 5
      GEOCODING_RATE_LIMIT_WINDOW_MS: 60000
      GEOCODING_RATE_LIMIT_MAX: 1000

      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
